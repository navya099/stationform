<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';">
  <title>StationForm</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./renderer.mjs"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><strong>StationForm</strong><span>부지·접근 검토</span></div>
    <button id="open-project" type="button">프로젝트 열기</button>
    <button id="save-project" type="button" disabled>프로젝트 저장</button>
    <button id="open-source" type="button">LandXML 열기</button>
    <button id="open-settings" type="button">설계 조건 열기</button>
    <button id="sample" type="button">샘플 열기</button>
  </header>
  <main class="workspace">
    <aside class="inputs" aria-label="프로젝트와 설계 조건">
      <h1>프로젝트</h1>
      <dl class="files">
        <dt>프로젝트 파일</dt><dd id="project-name">저장 전</dd>
        <dt>선형·현황 지표면</dt><dd id="source-name">미선택</dd>
        <dt>설계 조건</dt><dd id="settings-name">미선택</dd>
      </dl>
      <form id="study-form">
        <label for="station">기준 측점 (m)</label>
        <input id="station" type="number" step="any" required>
        <label for="alternative">표시 대안</label>
        <select id="alternative" required></select>
        <label for="plaza-level">광장 계획고 (m)</label>
        <input id="plaza-level" type="number" step="any" required>
        <fieldset class="building-controls">
          <legend>역사 본체</legend>
          <label class="building-toggle"><input id="building-enabled" type="checkbox" disabled>역사 매스</label>
          <fieldset id="building-fields" hidden disabled aria-label="역사 형식과 치수">
            <label for="building-type">역사 형식</label>
            <select id="building-type">
              <option value="over-track" data-key="floorAboveRail" data-label="레일면 대비 바닥 높이 (m)" data-default="8">선상역사</option>
              <option value="under-track" data-key="roofBelowRail" data-label="레일면에서 지붕까지 깊이 (m)" data-default="1">선하역사</option>
              <option value="elevated" data-key="floorAboveGround" data-label="현황 지표면 대비 바닥 높이 (m)" data-default="0">고가역사 하부</option>
            </select>
            <label for="building-length">길이 (m)</label><input id="building-length" type="number" step="any" value="24" required>
            <label for="building-width">폭 (m)</label><input id="building-width" type="number" step="any" value="20" required>
            <label for="building-height">높이 (m)</label><input id="building-height" type="number" step="any" value="6" required>
            <label for="building-clearance" id="building-offset-label">레일면 대비 바닥 높이 (m)</label><input id="building-clearance" type="number" step="any" value="8" required>
          </fieldset>
        </fieldset>
        <details class="road-controls">
          <summary>진입로</summary>
          <label class="building-toggle"><input id="road-enabled" type="checkbox" disabled>진입로 검토</label>
          <fieldset id="road-fields" hidden disabled aria-label="진입로 설계 조건">
            <label for="road-x">기존 도로 접속 X (m)</label><input id="road-x" type="number" step="any" required>
            <label for="road-y">기존 도로 접속 Y (m)</label><input id="road-y" type="number" step="any" required>
            <label for="road-width">진입로 폭 (m)</label><input id="road-width" type="number" step="any" value="6" required>
            <label for="road-edge">광장 접속 경계 번호</label><input id="road-edge" type="number" min="1" step="1" value="1" required>
            <label for="road-limit">검토 경사 (%)</label><input id="road-limit" type="number" step="any" required>
          </fieldset>
        </details>
        <button class="primary" type="submit" id="calculate" disabled>계산 적용</button>
      </form>
      <p id="status" role="status">샘플을 열거나 LandXML과 설계 조건을 선택하세요.</p>
    </aside>
    <div class="drawings">
      <section class="sheet">
        <div class="sheet-heading"><h2>배치 평면</h2><span id="track-name"></span><button type="button" data-export="plan" aria-label="배치 평면 DXF 저장" disabled>DXF 저장</button></div>
        <svg id="plan" viewBox="0 0 680 270" role="img" aria-label="선로, 승강장, 광장 및 횡단 절단선"></svg>
        <div class="legend"><span class="track-key">선로</span><span class="platform-key">승강장</span><span class="building-key" data-building-legend hidden>역사 본체</span><span class="plaza-key">역전광장</span><span class="road-key" data-road-legend hidden>진입로</span><span class="grading-key">사면 접합선</span><span class="cut-key">횡단 절단선</span></div>
      </section>
      <section class="sheet">
        <div class="sheet-heading"><h2>횡단면</h2><span id="section-name"></span><button type="button" data-export="section" aria-label="횡단면 DXF 저장" disabled>DXF 저장</button></div>
        <svg id="section" viewBox="0 0 680 240" role="img" aria-label="현황 및 계획 지표면 횡단면"></svg>
        <div class="legend"><span class="ground-key">현황 지표면</span><span class="proposed-key">계획 지표면</span><span class="platform-key">승강장</span><span class="building-key" data-building-legend hidden>역사 본체</span></div>
      </section>
    </div>
    <aside class="results" aria-label="대안별 토공량">
      <h2>토공량 비교</h2>
      <p id="volume-scope" class="result-context" hidden></p>
      <table>
        <thead><tr><th scope="col">대안</th><th scope="col">절토 (m³)</th><th scope="col">성토 (m³)</th></tr></thead>
        <tbody id="volumes"></tbody>
      </table>
      <button class="table-export" type="button" data-export="earthwork" aria-label="토공량 비교표 CSV 저장" disabled>CSV 저장</button>
      <dl class="levels">
        <dt>레일면 표고</dt><dd id="rail-level">—</dd>
        <dt>승강장 표고</dt><dd id="platform-level">—</dd>
        <div id="building-summary" hidden>
          <dt>역사 바닥 · 지붕 표고</dt><dd id="building-levels"></dd>
          <dt>역사 바닥 면적</dt><dd id="building-area"></dd>
        </div>
      </dl>
      <section class="report-tools" id="road-results" hidden>
        <h2>진입로 경사 비교</h2>
        <p id="road-overview"></p>
        <table>
          <thead><tr><th scope="col">대안</th><th scope="col">경사 (%)</th><th scope="col">검토</th></tr></thead>
          <tbody id="road-grades"></tbody>
        </table>
      </section>
      <section class="report-tools">
        <h2>건축설계설명서</h2>
        <details>
          <summary>설계 설명 작성</summary>
          <label for="report-intent">설계 의도</label>
          <textarea id="report-intent" rows="3"></textarea>
          <label for="report-rationale">대안 채택 사유</label>
          <textarea id="report-rationale" rows="3"></textarea>
        </details>
        <button class="table-export" type="button" data-export="report" aria-label="건축설계설명서 PDF 저장" disabled>PDF 저장</button>
      </section>
      <section class="report-tools">
        <h2>개념 모델</h2>
        <button class="table-export" type="button" data-export="model" aria-label="선택 대안 개념 모델 IFC 저장" disabled>IFC 저장</button>
      </section>
    </aside>
  </main>
</body>
</html>
